<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --burgundy:#6B1E2E;--burgundy-dark:#4A1420;--burgundy-light:#8B2E42;
  --gold:#C9A227;--gold-light:#E0BF4A;--gold-dark:#A8861A;
  --bg-main:#FAF6F0;--bg-card:#FFFFFF;--bg-input:#F7F1E8;
  --text-primary:#2A1810;--text-secondary:#5C4433;--text-muted:#9A8A7A;
  --border-color:#E8DCC8;--success:#2E7D32;--danger:#C62828;
  --gradient-gold:linear-gradient(135deg,#C9A227 0%,#E0BF4A 50%,#A8861A 100%);
  --gradient-burgundy:linear-gradient(135deg,#6B1E2E 0%,#8B2E42 100%);
  --shadow-gold:rgba(201,162,39,.25);--shadow-burgundy:rgba(107,30,46,.2);
  --font-heading:'Playfair Display',serif;--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:linear-gradient(135deg,#FAF6F0 0%,#F0E6D8 100%);min-height:100vh;padding:2rem 1rem;color:var(--text-primary)}
.home-bar{max-width:820px;margin:0 auto 1rem;display:flex;align-items:center;gap:1rem}
.home-btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--burgundy);color:#fff;text-decoration:none;padding:.5rem 1.2rem;border-radius:999px;font-size:.8rem;font-weight:600;transition:all .3s ease;box-shadow:0 2px 8px var(--shadow-burgundy)}
.home-btn:hover{background:var(--burgundy-light);transform:translateY(-2px)}
.home-bar .hint{font-size:.7rem;color:var(--text-muted)}
.container{position:relative;z-index:2;max-width:820px;width:100%;background:var(--bg-card);border-radius:20px;border:1px solid var(--border-color);box-shadow:0 4px 24px rgba(107,30,46,.08);padding:2.5rem;transition:all .3s ease;margin:0 auto}
.header-wrapper{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:.5rem}
.logo-section{display:flex;align-items:center;gap:1rem}
.logo-icon{width:56px;height:56px;background:var(--gradient-gold);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;color:#fff;box-shadow:0 4px 15px var(--shadow-gold);font-family:var(--font-heading)}
h1{font-family:var(--font-heading);font-size:1.8rem;font-weight:700;letter-spacing:.5px;color:var(--text-primary);line-height:1.2}
h1 .gold{color:var(--burgundy);display:block;font-size:.9rem;font-weight:400;letter-spacing:2px;font-family:var(--font-body);text-transform:uppercase}
.badge-pro{background:var(--gradient-burgundy);color:#fff;font-size:.6rem;font-weight:700;padding:.3rem 1rem;border-radius:30px;letter-spacing:1.5px;text-transform:uppercase;border:none;white-space:nowrap}
.divider-gold{width:80px;height:3px;background:var(--gradient-gold);margin:.8rem 0 1.2rem;border-radius:2px}
.sub-title{font-size:.75rem;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase;font-weight:400;border-left:3px solid var(--burgundy);padding-left:1rem;margin-bottom:1.5rem}
.ticker{overflow:hidden;white-space:nowrap;width:100%;padding:.6rem 0;margin:.2rem 0 1.2rem;color:var(--burgundy);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color);background:rgba(107,30,46,.03)}
.ticker span{display:inline-block;padding-left:100%;animation:scrollMarquee 25s linear infinite}
.ticker:hover span{animation-play-state:paused}
@keyframes scrollMarquee{0%{transform:translate(0,0)}100%{transform:translate(-100%,0)}}
.input-group{margin-bottom:1.5rem}
label{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:.5rem;font-family:var(--font-body)}
.file-drop-zone{background:var(--bg-input);border:2px dashed var(--border-color);border-radius:16px;padding:2.5rem 1.5rem;text-align:center;cursor:pointer;transition:all .3s ease;color:var(--text-secondary)}
.file-drop-zone:hover{border-color:var(--burgundy);background:rgba(107,30,46,.04);box-shadow:0 0 30px var(--shadow-burgundy)}
.file-drop-zone.dragover{border-color:var(--burgundy);background:rgba(107,30,46,.08);transform:scale(1.02)}
.file-drop-zone .icon-big{font-size:3rem;display:block;margin-bottom:.5rem}
.file-drop-zone .file-name{color:var(--burgundy);font-weight:600;font-size:1rem;margin-top:.5rem}
.file-drop-zone .file-size{font-size:.7rem;color:var(--text-muted)}
input[type="file"]{display:none}
input[type="text"]{width:100%;background:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;padding:.9rem 1.2rem;font-family:var(--font-body);color:var(--text-primary);font-size:.9rem;transition:all .3s ease}
input[type="text"]:focus{outline:none;border-color:var(--burgundy);box-shadow:0 0 0 3px rgba(107,30,46,.08)}
input[type="text"]::placeholder{color:var(--text-muted)}
.info-badge{background:rgba(201,162,39,.06);border:1px solid var(--border-color);border-radius:12px;padding:.8rem 1.2rem;margin:1.2rem 0 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.info-badge .icon{font-size:1.5rem}
.info-badge .text{font-size:.8rem;color:var(--text-secondary);flex:1}
.info-badge .text strong{color:var(--burgundy)}
.info-badge .tags{display:flex;gap:.5rem;flex-wrap:wrap}
.info-badge .tag{background:var(--bg-input);padding:.2rem .8rem;border-radius:20px;font-size:.6rem;color:var(--text-muted);border:1px solid var(--border-color);text-transform:uppercase;letter-spacing:.5px}
.info-badge .tag.active{border-color:var(--burgundy);color:var(--burgundy)}
.status-panel{background:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;padding:1rem 1.2rem;font-family:'Courier New',monospace;font-size:.8rem;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto;margin-top:1rem;line-height:2;box-shadow:inset 0 2px 8px rgba(107,30,46,.03)}
.status-panel::-webkit-scrollbar{width:5px}
.status-panel::-webkit-scrollbar-track{background:var(--bg-main)}
.status-panel::-webkit-scrollbar-thumb{background:var(--burgundy);border-radius:10px}
.status-panel .success{color:var(--success)}
.status-panel .error{color:var(--danger)}
.status-panel .gold{color:var(--burgundy)}
.failed-preview{margin-top:1rem;border:1px solid var(--danger);border-radius:12px;background:rgba(198,40,40,.04);display:none;overflow:hidden}
.failed-preview .header{background:rgba(198,40,40,.06);padding:.6rem 1.2rem;border-bottom:1px solid var(--danger);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.failed-preview .header .title{color:var(--danger);font-weight:600;font-size:.85rem}
.failed-preview .content{padding:1rem 1.2rem;max-height:200px;overflow-y:auto;font-family:'Courier New',monospace;font-size:.7rem;white-space:pre-wrap;color:var(--text-secondary)}
.btn-bypass{background:var(--danger);border:none;color:#fff;padding:.5rem 1.2rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.75rem;transition:all .3s ease;text-transform:uppercase;letter-spacing:.5px;font-family:var(--font-body)}
.btn-bypass:hover{background:#A81F1F;box-shadow:0 4px 15px rgba(198,40,40,.3);transform:translateY(-2px)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 2.4rem;border:none;border-radius:999px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;font-size:.95rem;font-weight:600;letter-spacing:-.01em;color:#fff;background:var(--gradient-burgundy);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -1px 0 rgba(0,0,0,.15) inset,0 4px 12px var(--shadow-burgundy),0 1px 3px rgba(0,0,0,.1);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);user-select:none;-webkit-tap-highlight-color:transparent;opacity:.45;pointer-events:none}
.btn-primary.enabled{opacity:1;pointer-events:auto}
.btn-primary.enabled:hover{transform:scale(1.03);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -1px 0 rgba(0,0,0,.15) inset,0 6px 20px var(--shadow-burgundy),0 2px 6px rgba(0,0,0,.12)}
.btn-primary.enabled:active{transform:scale(.97);filter:brightness(.95)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(42,24,16,.5);backdrop-filter:blur(4px);z-index:999;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.active{display:flex}
.modal-box{background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;padding:2.5rem;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(107,30,46,.15);animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-box h2{font-family:var(--font-heading);color:var(--burgundy);font-size:1.5rem;margin-bottom:.5rem}
.modal-box .sub{color:var(--text-secondary);font-size:.85rem;margin-bottom:1.5rem}
.modal-box .divider{height:1px;background:var(--border-color);margin:1rem 0}
.modal-options{display:flex;flex-direction:column;gap:.8rem;margin:1.5rem 0}
.modal-options label{display:flex;align-items:center;gap:.8rem;background:var(--bg-input);padding:.8rem 1.2rem;border-radius:12px;border:2px solid var(--border-color);cursor:pointer;transition:all .3s ease;font-size:.95rem;font-weight:500;color:var(--text-primary);text-transform:none;letter-spacing:0}
.modal-options label:hover{border-color:var(--burgundy);background:rgba(107,30,46,.04)}
.modal-options label:has(input:checked){border-color:var(--burgundy);background:rgba(107,30,46,.06)}
.modal-options input[type="checkbox"]{width:20px;height:20px;accent-color:var(--burgundy);cursor:pointer}
.modal-options .option-icon{font-size:1.3rem}
.modal-options .option-desc{font-size:.7rem;color:var(--text-muted);font-weight:400}
.modal-actions{display:flex;gap:.8rem;margin-top:1rem;flex-wrap:wrap}
.modal-actions button{flex:1;min-width:100px;padding:.8rem 1.5rem;border:none;border-radius:12px;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .3s ease;font-family:var(--font-body)}
.btn-confirm{background:var(--gradient-burgundy);color:#fff}
.btn-confirm:hover{transform:translateY(-2px);box-shadow:0 8px 25px var(--shadow-burgundy)}
.btn-cancel{background:var(--bg-input);color:var(--text-secondary);border:1px solid var(--border-color)}
.btn-cancel:hover{border-color:var(--text-muted);color:var(--text-primary)}
.footer-note{margin-top:1.8rem;font-size:.6rem;text-align:center;color:var(--text-muted);border-top:1px solid var(--border-color);padding-top:1.2rem;text-transform:uppercase;letter-spacing:1.5px}
.footer-note .gold{color:var(--burgundy)}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--border-color);border-top:3px solid var(--burgundy);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:10px}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.processing-text{display:inline-flex;align-items:center;gap:10px}
.group-panel{background:rgba(201,162,39,.04);border:1px solid var(--border-color);border-radius:12px;padding:1.2rem 1.5rem;margin:1.2rem 0 1.5rem;transition:all .3s ease;display:none}
.group-panel.visible{display:block}
.group-panel.active{border-color:var(--burgundy);background:rgba(107,30,46,.05);box-shadow:0 0 30px var(--shadow-burgundy)}
.group-panel .panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;margin-bottom:.8rem}
.group-panel .panel-header .title{display:flex;align-items:center;gap:.6rem;font-size:.8rem;font-weight:600;color:var(--text-primary)}
.group-panel .panel-header .title .icon{font-size:1.2rem}
.group-panel .panel-header .badge-group{background:var(--gradient-gold);color:#fff;font-size:.55rem;font-weight:700;padding:.2rem .8rem;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.group-panel .panel-body textarea{width:100%;background:var(--bg-input);border:1px solid var(--border-color);border-radius:12px;padding:.9rem 1.2rem;color:var(--text-primary);font-family:'Courier New',monospace;font-size:.8rem;resize:vertical;min-height:80px;transition:all .3s ease;line-height:1.8}
.group-panel .panel-body textarea:focus{outline:none;border-color:var(--burgundy);box-shadow:0 0 0 3px rgba(107,30,46,.08)}
.group-panel .panel-body textarea::placeholder{color:var(--text-muted);font-family:var(--font-body);font-size:.75rem}
.group-panel .panel-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;margin-top:.2rem}
.group-panel .panel-footer .hint{font-size:.65rem;color:var(--text-muted);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.group-panel .panel-footer .hint .key{background:var(--bg-input);padding:.1rem .5rem;border-radius:4px;border:1px solid var(--border-color);font-family:'Courier New',monospace;font-size:.6rem;color:var(--text-secondary)}
.group-panel .panel-footer .group-count{font-size:.7rem;color:var(--burgundy);font-weight:600}
.group-panel .panel-footer .group-count .warning{color:var(--danger);animation:pulseWarning 1s ease-in-out infinite}
@keyframes pulseWarning{0%,100%{opacity:1}50%{opacity:.5}}
.toggle-wrapper{display:flex;align-items:center;gap:.8rem;cursor:pointer;padding:.4rem 0}
.toggle-wrapper input[type="checkbox"]{display:none}
.toggle-track{width:44px;height:24px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:30px;position:relative;transition:all .3s ease;flex-shrink:0}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--text-muted);border-radius:50%;transition:all .3s ease}
.toggle-wrapper input:checked+.toggle-track{background:var(--gradient-burgundy);border-color:var(--burgundy)}
.toggle-wrapper input:checked+.toggle-track::after{left:22px;background:#fff}
.toggle-label{font-size:.75rem;font-weight:500;color:var(--text-secondary);letter-spacing:.3px}
.toggle-label .highlight{color:var(--burgundy);font-weight:600}
.group-examples{display:flex;gap:.5rem;flex-wrap:wrap}
.group-examples .example-tag{background:var(--bg-input);border:1px solid var(--border-color);border-radius:6px;padding:.2rem .6rem;font-size:.6rem;color:var(--text-muted);cursor:pointer;transition:all .3s ease;font-family:'Courier New',monospace}
.group-examples .example-tag:hover{border-color:var(--burgundy);color:var(--burgundy);background:rgba(107,30,46,.04)}
#groupInfoModal{background:rgba(201,162,39,.06);border:1px solid var(--border-color);border-radius:8px;padding:.8rem 1rem;margin:.5rem 0;font-size:.75rem;color:var(--text-secondary);display:none}
#groupInfoModal .label{color:var(--burgundy);font-weight:600}
@media(max-width:640px){.container{padding:1.5rem}.header-wrapper{flex-direction:column;align-items:flex-start}h1{font-size:1.4rem}.logo-icon{width:44px;height:44px;font-size:1.4rem}.modal-box{padding:1.5rem}.modal-actions{flex-direction:column}.failed-preview .header{flex-direction:column;align-items:stretch}.info-badge{flex-direction:column;align-items:flex-start}}
@media print{body{background:#fff;padding:.5in}.container{box-shadow:none;border:1px solid #ddd}.btn-primary,.file-label,.btn-bypass,.home-bar{display:none!important}}
</style>
</head>
<body>

<div class="home-bar">
  <a href="https://parkson127.github.io/" class="home-btn">🏠 Home</a>
  <span class="hint">← Back to dashboard</span>
</div>

<div class="container" id="mainContainer"></div>

<div class="modal-overlay" id="downloadModal">
  <div class="modal-box">
    <h2>📥 Download Report</h2>
    <div class="sub">Select your preferred download format(s)</div>
    <div class="divider"></div>
    <div class="modal-options">
      <label><input type="checkbox" id="optTxt" checked><span class="option-icon">📄</span><div><div>TXT Files</div><div class="option-desc">Complete set: Dept, Compile, Ranking, Failed, Summary</div></div></label>
      <label><input type="checkbox" id="optExcel" checked><span class="option-icon">📊</span><div><div>Excel (Multi-Sheet)</div><div class="option-desc">3 Sheets: All Data + By Dept + Ranking</div></div></label>
      <label style="opacity:.5;cursor:not-allowed;"><input type="checkbox" id="optPDF" disabled><span class="option-icon">📕</span><div><div>PDF Report</div><div class="option-desc" style="color:var(--burgundy);">🚀 Coming Soon</div></div></label>
    </div>
    <div id="groupInfoModal"><span class="label">📊 Group Mode:</span> <span id="groupModalInfo">-</span></div>
    <div class="divider"></div>
    <div class="modal-actions">
      <button class="btn-confirm" onclick="window.confirmDownload()">⬇ Download Now</button>
      <button class="btn-cancel" onclick="window.closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
(function(){
  if(window._rankingInitialized)return;
  window._rankingInitialized=true;

  const MAX_GROUPS=10;
  let processedData=null;
  let isProcessing=false;
  let _lastProcessedFile=null;

  function safeName(str){return(str||"UNKNOWN").replace(/[\/\\:*?"<>|]/g,'').trim()}
  function formatMonthYearFull(m){
    if(!m)return"Unknown";
    let p=m.match(/([A-Z]{3,4})'(\d{2})/);if(!p)return m;
    let map={JAN:"January",FEB:"February",MAR:"March",APR:"April",MAY:"May",JUN:"June",JUL:"July",AUG:"August",SEP:"September",OCT:"October",NOV:"November",DEC:"December"};
    return map[p[1].toUpperCase()]+' '+(2000+parseInt(p[2]));
  }
  function extractMonthYearFromText(t){
    const map={JAN:'JAN',JANUARY:'JAN',FEB:'FEB',FEBRUARY:'FEB',MAR:'MAR',MARCH:'MAR',APR:'APR',APRIL:'APR',MAY:'MAY',JUN:'JUN',JUNE:'JUN',JUL:'JUL',JULY:'JUL',AUG:'AUG',AUGUST:'AUG',SEP:'SEP',SEPTEMBER:'SEP',OCT:'OCT',OCTOBER:'OCT',NOV:'NOV',NOVEMBER:'NOV',DEC:'DEC',DECEMBER:'DEC'};
    let patterns=[/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)['']?\s*(\d{2})\b/i,/\b(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)\s+(\d{4})\b/i,/<\s*(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)['']?\s*(\d{2})\s*>/i,/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[\s\-](\d{2})\b/i,/\b(\d{2})[\s\-](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\b/i];
    for(let p of patterns){
      let m=t.match(p);
      if(m){
        let ms,ys;
        if(p===patterns[1]){ms=m[1];ys=m[2]}else if(p===patterns[4]){ys=m[1];ms=m[2]}else{ms=m[1];ys=m[2]}
        let month=map[ms.toUpperCase()];if(!month)continue;
        let y=parseInt(ys);if(y<100)y+=2000;if(y<2000||y>2099)continue;
        let py=y-1;return{ly:month+"'"+String(py).slice(-2),ty:month+"'"+String(y).slice(-2)};
      }
    }
    return null;
  }
  function detectMonthFromText(lines){
    for(let l of lines.slice(0,5)){
      let m=l.match(/Month of ([A-Z]{3,10})['']?\s*(\d{2,4})/i);
      if(m){
        let map={JAN:'JAN',JANUARY:'JAN',FEB:'FEB',FEBRUARY:'FEB',MAR:'MAR',MARCH:'MAR',APR:'APR',APRIL:'APR',MAY:'MAY',JUN:'JUN',JUNE:'JUN',JUL:'JUL',JULY:'JUL',AUG:'AUG',AUGUST:'AUG',SEP:'SEP',SEPTEMBER:'SEP',OCT:'OCT',OCTOBER:'OCT',NOV:'NOV',NOVEMBER:'NOV',DEC:'DEC',DECEMBER:'DEC'};
        let month=map[m[1].toUpperCase()]||m[1].toUpperCase().substring(0,3);
        let y=parseInt(m[2]);if(y<100)y+=2000;
        if(y>=2000&&y<=2099){let py=y-1;return{ly:month+"'"+String(py).slice(-2),ty:month+"'"+String(y).slice(-2)}}
      }
    }
    for(let l of lines){let r=extractMonthYearFromText(l);if(r)return r}
    for(let l of lines){if(l.includes('CATEGORY DESCRIPTION')||l.includes('BRAND    DESCRIPTION')){let r=extractMonthYearFromText(l);if(r)return r}}
    let now=new Date(),months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],cm=months[now.getMonth()],cy=now.getFullYear(),y=now.getMonth()>=6?cy+1:cy;
    return{ly:cm+"'"+String(y-1).slice(-2),ty:cm+"'"+String(y).slice(-2)};
  }
  function downloadFile(n,c){
    try{
      let b=new Blob(["\uFEFF"+c.join("\n")],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download=n+".txt";document.body.appendChild(a);a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},200);return true;
    }catch(e){return false}
  }
  function isExcludedLine(l){
    let t=l.trim();
    return /^\d{3}\s+ISR\d+/.test(t)||t.includes("REPORT CODE")||t.includes("PRINTED BY")||t.includes("VIA TERMINAL")||t.includes("PAGE :")||t===""||t.includes("\f")||t.includes("MONTHLY GROWTH")||t.includes("YEARLY GROWTH");
  }
  function isNonBrandLine(l){
    let t=l.trim(),tl=t.toLowerCase();
    if(tl.includes("store :")||tl.includes("store      :"))return true;
    if(tl.includes("brand")&&tl.includes("description")&&(tl.includes("sales")||tl.includes("may'")||tl.includes("jun'")||tl.includes("jul'")))return true;
    if(tl.includes("sales")&&tl.includes("rank")&&tl.includes("growth"))return true;
    if(/sales\s+rank/.test(tl)||/sales\s{2,}rank/.test(tl))return true;
    if(tl.includes("sales successfully closed")||tl.includes("department/store brand - summary report"))return true;
    if(tl.includes("from store")&&tl.includes("to"))return true;
    if(/^[\s\-=]+$/.test(t))return true;
    if(tl.includes("report code")||tl.includes("printed by")||tl.includes("via terminal")||tl.includes("page :"))return true;
    if(/^[A-Z0-9]{2,5}\s{2,}/.test(t))return false;
    if(/^(brand|description|sales|rank|growth|store|from|date|to|may|jun|jul|aug|sep|oct|nov|dec|jan|feb|mar|apr)\s+/i.test(t))return true;
    if(/^(sales|rank)\s+/i.test(t))return true;
    return t.split(/\s+/).length<4;
  }
  function parseBrandByColumns(l){
    let t=l;
    if(isNonBrandLine(l))return null;
    if(t.includes("BRAND TOTAL")||t.includes("DEPARTMENT")||t.startsWith("---"))return null;
    if(t.includes("BRAND")&&t.includes("DESCRIPTION")&&t.includes("SALES"))return null;
    if(t.includes("STORE TOTAL"))return null;
    let padded=t.padEnd(131,' ');
    let brand=padded.substring(0,5).trim(),desc=padded.substring(5,36).trim();
    if(!brand||!desc)return null;
    let salesLY=parseFloat(padded.substring(36,46).trim())||0;
    let rankLY=parseInt(padded.substring(46,51).trim())||0;
    let salesTY=parseFloat(padded.substring(51,61).trim())||0;
    let rankTY=parseInt(padded.substring(61,66).trim())||0;
    let growth=padded.substring(66,76).trim();
    let salesB=parseFloat(padded.substring(76,86).trim())||0;
    let rankB=parseInt(padded.substring(86,91).trim())||0;
    let salesA=parseFloat(padded.substring(91,101).trim())||0;
    let rankA=parseInt(padded.substring(101,106).trim())||0;
    let growthAB=padded.substring(106,116).trim();
    let salesJan=parseFloat(padded.substring(116,126).trim())||0;
    let rankJan=parseInt(padded.substring(126,131).trim())||0;
    if(isNaN(rankLY)||isNaN(rankTY)||rankLY<0||rankLY>500||rankTY<0||rankTY>500)return null;
    function pg(v){if(!v)return null;v=v.trim();if(v==='')return null;if(v.endsWith('-'))return parseFloat('-'+v.slice(0,-1));return parseFloat(v)}
    return{code:brand,name:desc,salesLY,salesLY,rankLY,salesTY,rankTY,growth:pg(growth),salesB,rankB,salesA,rankA,growthAB:pg(growthAB),salesJan,rankJan};
  }
  function buildDeptData(dept){
    var rows=[],seen=new Set(),hasStoreTotal=false,storeTotalData=[];
    for(var idx=0;idx<dept.raw.length;idx++){
      var t=dept.raw[idx];
      if(t.indexOf('STORE TOTAL')!==-1){
        hasStoreTotal=true;
        var padded=t.padEnd(131,' ');
        var fixNeg=function(v){if(!v)return'';v=String(v).trim();if(v==='')return'';if(v.indexOf('-')===v.length-1)return'-'+v.substring(0,v.length-1);return v};
        storeTotalData=[fixNeg(padded.substring(36,46).trim())||'',fixNeg(padded.substring(51,61).trim())||'',fixNeg(padded.substring(66,76).trim())||'',fixNeg(padded.substring(76,86).trim())||'',fixNeg(padded.substring(91,101).trim())||'',fixNeg(padded.substring(106,116).trim())||'',fixNeg(padded.substring(116,126).trim())||''];
        continue;
      }
      if(t.indexOf('BRAND')!==-1&&t.indexOf('DESCRIPTION')!==-1&&t.indexOf('SALES')!==-1)continue;
      if(t.indexOf('SALES')!==-1&&t.indexOf('RANK')!==-1)continue;
      if(t.indexOf('DEPARTMENT :')!==-1||t.indexOf('STORE      :')!==-1)continue;
      if(t.indexOf('------------------------------------------------------------------------------------------------------------------------------------')!==-1)continue;
      var p2=t.padEnd(131,' ');
      var brand=p2.substring(0,5).trim(),desc=p2.substring(5,36).trim();
      if(!brand||!desc||brand==='BRAND'||brand==='STORE')continue;
      var key=brand+'|'+desc;if(seen.has(key))continue;seen.add(key);
      var salesB2=p2.substring(76,86).trim();
      var fixNeg2=function(v){if(!v)return'';v=String(v).trim();if(v==='')return'';if(v.indexOf('-')===v.length-1)return'-'+v.substring(0,v.length-1);return v};
      var isZero=function(v){var x=String(v).trim();return x==='0'||x==='0.0'||x==='0.00'||x===''};
      var growthABVal=fixNeg2(p2.substring(106,116).trim());
      if(isZero(salesB2))growthABVal='';
      rows.push([brand,desc,fixNeg2(p2.substring(36,46).trim()),p2.substring(46,51).trim(),fixNeg2(p2.substring(51,61).trim()),p2.substring(61,66).trim(),fixNeg2(p2.substring(66,76).trim()),fixNeg2(salesB2),p2.substring(86,91).trim(),fixNeg2(p2.substring(91,101).trim()),p2.substring(101,106).trim(),growthABVal,fixNeg2(p2.substring(116,126).trim()),p2.substring(126,131).trim()]);
    }
    return{rows,hasStoreTotal,storeTotalData};
  }

  function parseGroups(i){
    if(!i||i.trim()==='')return null;
    let g={},l=i.split('\n').filter(x=>x.trim()!=='');
    if(l.length>MAX_GROUPS){alert('⚠️ Maximum '+MAX_GROUPS+' groups allowed. You have '+l.length+' groups.');return null}
    for(let line of l){
      let ci=line.indexOf(':');if(ci===-1)continue;
      let gn=line.substring(0,ci).trim(),dp=line.substring(ci+1).trim();
      if(!gn||!dp)continue;
      let d=[];
      for(let item of dp.split(',')){
        item=item.trim();
        if(item.includes('-')){
          let rg=item.split('-'),st=parseInt(rg[0].trim()),en=parseInt(rg[1].trim());
          if(!isNaN(st)&&!isNaN(en)&&st<=en){for(let x=st;x<=en;x++)d.push(String(x))}
        }else if(/^\d+$/.test(item))d.push(item);
      }
      if(d.length>0)g[gn]=d;
    }
    let cnt=Object.keys(g).length;
    if(cnt>MAX_GROUPS){alert('⚠️ Maximum '+MAX_GROUPS+' groups allowed. You have '+cnt+' groups.');return null}
    return cnt>0?g:null;
  }

  function processData(file){
    return new Promise((resolve)=>{
      let enabled=document.getElementById('enableGrouping').checked;

      let allowedDepts=null;
      if(groups){let all=[];for(let n in groups)all.push(...groups[n]);allowedDepts=all}
      else{
        let fi=document.getElementById("deptFilter").value.trim();
        if(fi!==""){
          let d=[];
          for(let p of fi.split(',')){
            p=p.trim();
            if(p.includes('-')){
              let rg=p.split('-'),st=parseInt(rg[0].trim()),en=parseInt(rg[1].trim());
              if(!isNaN(st)&&!isNaN(en)&&st<=en){for(let x=st;x<=en;x++)d.push(String(x))}
            }else if(/^\d+$/.test(p))d.push(p);
          }
          allowedDepts=d.length?d:null;
        }
      }
      let statusDiv=document.getElementById("status");
      let reader=new FileReader();
      reader.onload=function(e){
        try{
          let lines=e.target.result.split(/\r?\n/);
          let months=detectMonthFromText(lines);
          let tyFull=formatMonthYearFull(months.ty);
          let deptMap=new Map(),current=null,inside=false,found=false,dashAdded=false,headerAdded=false,storeAdded=false,rawLines=[],globalHeaderLines=[],storeLine="";
          function saveDept(){
            if(!current)return;
            let code=current.code;
            if(deptMap.has(code)){
              let ex=deptMap.get(code);
              for(let l of rawLines){if(!ex.raw.includes(l))ex.raw.push(l)}
              for(let b of current.brands){if(!ex.brands.some(x=>x.code===b.code))ex.brands.push(b)}
              if(current.failed)ex.failed.push(...current.failed);
            }else{
              deptMap.set(code,{code,name:current.name,raw:[...rawLines],brands:[...current.brands],failed:current.failed||[]});
            }
            current=null;rawLines=[];dashAdded=headerAdded=storeAdded=false;
          }
          for(let i=0;i<lines.length;i++){
            let line=lines[i],t=line.trim();
            if(isExcludedLine(line))continue;
            if(t.includes("DEPARTMENT/STORE BRAND - SUMMARY REPORT")&&!t.includes("CATEGORY")){saveDept();inside=true;found=true;continue}
            if(t.includes("DEPARTMENT/STORE - DETAIL REPORT")||t.includes("CATEGORY")){if(inside)saveDept();inside=false;continue}
            if(!inside)continue;
            if(t.startsWith("STORE :"))storeLine=line;
            let deptMatch=t.match(/^DEPARTMENT\s*:\s*(\d+)\s+(.+)$/i);
            if(deptMatch){
              saveDept();
              let deptCode=deptMatch[1];
              if(allowedDepts&&!allowedDepts.includes(deptCode)){current=null;continue}
              let fullName=deptMatch[2].trim();
              fullName=fullName.replace(/\s*FROM\s+STORE\s*:\s*\d+\s+TO\s+\d+\s*$/i,'').replace(/\s*FROM\s+STORE\s+\d+\s+TO\s+\d+\s*$/i,'').replace(/\s*FROM\s+STORE.*$/i,'');
              current={code:deptCode,name:fullName.trim(),brands:[],failed:[]};
              continue;
            }
            if(!current)continue;
            if(t.includes("------------------------------------------------------------------------------------------------------------------------------------")){if(!dashAdded){rawLines.push(line);dashAdded=true}continue}
            if(t.includes("BRAND")&&t.includes("DESCRIPTION")&&t.includes("SALES")){if(!headerAdded){rawLines.push(line);headerAdded=true}continue}
            if(t.includes("STORE TOTAL")){if(!storeAdded){rawLines.push(line);storeAdded=true}continue}
            if(t==="")continue;
            rawLines.push(line);
            let brand=parseBrandByColumns(line);
            if(brand){
              let diff=brand.rankLY-brand.rankTY;
              let arrow=diff>0?"↑":diff<0?"↓":"➖";
              let move=Math.abs(diff)>0?arrow+Math.abs(diff):arrow+"0";
              if(!current.brands.some(b=>b.code===brand.code)){
                current.brands.push({code:brand.code,name:brand.name,salesLY:brand.salesLY||0,rankLY:brand.rankLY,salesTY:brand.salesTY||0,rankTY:brand.rankTY,growth:brand.growth,salesB:brand.salesB||0,rankB:brand.rankB,salesA:brand.salesA||0,rankA:brand.rankA,growthAB:brand.growthAB,salesJan:brand.salesJan||0,rankJan:brand.rankJan,move:move});
              }
            }else if(!isNonBrandLine(line))current.failed.push({lineNumber:i+1,text:line,reason:"format mismatch (fixed-width expected)"});
          }
          saveDept();
          if(!found){statusDiv.innerHTML="◆ ERROR: 'DEPARTMENT/STORE BRAND - SUMMARY REPORT' not found.";resolve(null);return}
          if(deptMap.size===0){statusDiv.innerHTML="◇ No departments match filter.";resolve(null);return}

          let allDepts=Array.from(deptMap.values()).sort((a,b)=>parseInt(a.code)-parseInt(b.code));
          let totalBrands=allDepts.reduce((s,d)=>s+d.brands.length,0);
          let totalFailed=allDepts.reduce((s,d)=>s+(d.failed?d.failed.length:0),0);
          let headerTitle="DEPARTMENT/STORE BRAND - SUMMARY REPORT";
          let headerSub=`( Sales Successfully Closed for the Month of ${months.ty} )`;
          let storeLineFinal=storeLine||"STORE      :  G 127 PARKSON IOI CITY MALL                                                     FROM DATE  :          TO";
          let dashLine="------------------------------------------------------------------------------------------------------------------------------------";
          let ly=months.ly,ty=months.ty;
          let headerCols=[`BRAND    DESCRIPTION                   < ${ly}    >  < ${ty}    >           JUL'24-${ly}  JUL'25-${ty}            JAN'26-${ty}`,"                                        SALES   RANK   SALES   RANK  GROWTH  SALES (B) RANK SALES (A) RANK   GROWTH     SALES   RANK"];
          function buildFullHeader(dept){
            return ["=".repeat(85),headerTitle,headerSub,`DEPARTMENT : ${dept.code} ${dept.name}`,storeLineFinal,dashLine,headerCols[0],headerCols[1],dashLine];
          }
          function filterRawData(raw){
            return raw.filter(line=>{
              let t=line.trim();
              if(t==='')return true;

              if(t.includes('------------------------------------------------------------------------------------------------------------------------------------'))return false;
              if(t.includes('BRAND')&&t.includes('DESCRIPTION')&&t.includes('SALES'))return false;
              if(t.includes('SALES')&&t.includes('RANK')&&t.includes('GROWTH'))return false;
              if(t.includes('DEPARTMENT :'))return false;
              if(t.includes('<')&&t.includes('>')&&(t.includes('SALES')||t.includes('RANK')))return false;
              if(/^BRAND\s+DESCRIPTION/.test(t))return false;
              if(/^\s*SALES\s+RANK/.test(t))return false;

          }

          let allFiles=[];

  function downloadAllFiles(files,statusDiv,callback){
    if(!files||files.length===0){if(statusDiv)statusDiv.innerHTML="◇ No TXT files to download.";if(callback)callback();return}

  }

      <div class="ticker"><span>✦ Corporate Analytics · Auto-Process · Multi-Sheet Excel · Complete TXT Reports ✦</span></div>
      <div class="input-group">
        <label>📁 Upload Report (.txt)</label>
        <div class="file-drop-zone" id="dropZone">
          <span class="icon-big">📂</span>
          <div>Drop your .txt file here or click to browse</div>
          <div class="file-name" id="fileNameDisplay"></div>
          <div class="file-size" id="fileSizeDisplay"></div>
        </div>
        <input type="file" id="file" accept=".txt">
      </div>
      <div class="input-group">
        <label>🎯 Department Filter (optional)</label>
        <input type="text" id="deptFilter" placeholder="e.g., 20,21,22 or 20-22 — leave empty for all">
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;margin:.2rem 0 1.2rem;">
        <label class="toggle-wrapper">
          <input type="checkbox" id="enableGrouping" onchange="window.toggleGrouping()">
          <span class="toggle-track"></span>
          <span class="toggle-label"><span class="highlight">Group</span> Mode <span style="font-size:.65rem;color:var(--text-muted);font-weight:400;">(Combine departments into custom groups)</span></span>
        </label>
        <span style="font-size:.65rem;color:var(--text-muted);"><span id="groupStatus">● Individual Mode</span></span>
      </div>
      <div class="group-panel" id="groupPanel">
        <div class="panel-header">
          <div class="title"><span class="icon">📊</span><span>Grouping Configuration</span></div>
          <span class="badge-group">✦ Corporate</span>
        </div>
        <div class="panel-body">
          <textarea id="groupInput" placeholder="Ladies: 20,21,22,29,35&#10;Cosmetic: 31,32,33,34,37&#10;Gents: 41,42,43,44,46,47&#10;Children: 51,52,61&#10;HH&amp;HE: 55,57,58,65" oninput="window.updateGroupCount()"></textarea>
        </div>
        <div class="panel-footer">
          <div class="hint">
            <span>💡</span><span>Format:</span><span class="key">GROUP_NAME: dept1,dept2,dept3</span>
            <span>or range</span><span class="key">20-23</span>
            <span class="group-examples">
              <span class="example-tag" onclick="window.loadExample('ladies')">Ladies</span>
              <span class="example-tag" onclick="window.loadExample('gents')">Gents</span>
              <span class="example-tag" onclick="window.loadExample('cosmetic')">Cosmetic</span>
              <span class="example-tag" onclick="window.loadExample('children')">Children</span>
              <span class="example-tag" onclick="window.loadExample('hhhe')">HH&amp;HE</span>
            </span>
          </div>
          <div class="group-count" id="groupCount">0 / 10 groups</div>
        </div>
      </div>
      <div style="display:flex;justify-content:center;margin:1.2rem 0 1.5rem;">
        <button id="btnDownloadReport" onclick="window.showDownloadModal()" class="btn-primary">
          <span style="font-size:1.15rem;line-height:1;">⬇️</span>
          <span>Download Report</span>
        </button>
      </div>
      <div class="info-badge">
        <span class="icon">📋</span>
        <div class="text"><strong>Complete Report Package</strong> — All files will be generated automatically:</div>
        <div class="tags">
          <span class="tag active">Dept Files</span>
          <span class="tag active">Compile All</span>
          <span class="tag active">Ranking</span>
          <span class="tag active">Failed Lines</span>
          <span class="tag active">Summary</span>
        </div>
      </div>
      <div id="status" class="status-panel">◆ Burgundy Gold System Ready ◆<br><br>✔ Drop a .txt file or click to browse — auto-processing will start immediately.</div>
      <div id="failedPreview" class="failed-preview">
        <div class="header"><span class="title">⚠️ Failed Lines Detected</span></div>
        <div class="content" id="failedContent"></div>
      </div>
      <div class="footer-note"><span class="gold">✦</span> Complete Report · Auto-Process · v12 Burgundy Gold <span class="gold">✦</span></div>
    `;
    document.getElementById("file").addEventListener("change",function(e){if(e.target.files.length)handleFileUpload(e.target.files[0])});
    let dz=document.getElementById("dropZone");
    dz.addEventListener("click",function(){document.getElementById("file").click()});
    dz.addEventListener("dragover",function(e){e.preventDefault();dz.classList.add("dragover")});
    dz.addEventListener("dragleave",function(){dz.classList.remove("dragover")});
    dz.addEventListener("drop",function(e){
      e.preventDefault();dz.classList.remove("dragover");
      let files=e.dataTransfer.files;
      if(files.length){
        let file=files[0];
        if(file.name.endsWith('.txt')){
          let dt=new DataTransfer();dt.items.add(file);document.getElementById("file").files=dt.files;handleFileUpload(file);
        }else document.getElementById("status").innerHTML="◆ Please upload a .txt file only.";
      }
    });
    document.getElementById("downloadModal").addEventListener("click",function(e){if(e.target===e.currentTarget)closeModal()});
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
    window.toggleGrouping=toggleGrouping;
    window.updateGroupCount=updateGroupCount;
    window.loadExample=loadExample;
    window.showDownloadModal=showDownloadModal;
    window.closeModal=closeModal;
    window.confirmDownload=confirmDownload;
    window.reprocessIfNeeded=reprocessIfNeeded;
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',renderPage);
  else renderPage();
})();
</script>
</body>
</html>
